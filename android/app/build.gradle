plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

// Gemini API key: read from environment (set as a GitHub Actions secret in CI)
// or from android/local.properties (GEMINI_API_KEY=...) for local builds.
// Never hard-code the real key in this file - the repo is public.
def geminiApiKey = System.getenv("GEMINI_API_KEY") ?: (localProperties.getProperty("GEMINI_API_KEY") ?: "")

android {
    namespace "com.salimsrk.typeassist"
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    // A fixed, committed keystore (NOT a Play Store release key - just a
    // consistent signature for sideloaded installs). Using this instead of
    // the machine-local debug keystore means every APK built anywhere (your
    // laptop, GitHub Actions, another machine) is signed identically, so
    // installing a newer build always works as an update instead of
    // failing with "App not installed" from a signature mismatch.
    signingConfigs {
        release {
            storeFile file("typeassist-debug.keystore")
            storePassword "typeassist123"
            keyAlias "typeassist"
            keyPassword "typeassist123"
        }
    }

    defaultConfig {
        applicationId "com.salimsrk.typeassist"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiApiKey}\""
    }

    buildTypes {
        release {
            // See signingConfigs.release above - keeps every build's
            // signature identical so updates install cleanly. Swap in a
            // real, private signing config before publishing to the Play
            // Store (this one being public in the repo is fine for
            // sideloading, but must never be used for a real release).
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"
}
