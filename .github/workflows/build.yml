name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # This repo's android/ folder does not commit the Gradle wrapper jar
      # (it's a binary file), and the Gradle/AGP/Kotlin versions that the
      # currently-installed Flutter SDK requires can change with every
      # Flutter release. So instead of pinning those versions by hand, we
      # scaffold a throwaway project with the SDK that was just installed
      # above and borrow its generic build files - they always match
      # whatever this Flutter version actually needs. Only app/build.gradle
      # and everything under app/src/ are ours and are left untouched.
      - name: Sync Gradle/AGP versions from the installed Flutter SDK
        run: |
          flutter create --platforms=android --org=com.salimsrk --project-name=scaffold /tmp/scaffold
          mkdir -p android/gradle/wrapper
          cp /tmp/scaffold/android/gradlew android/gradlew
          cp /tmp/scaffold/android/gradlew.bat android/gradlew.bat
          cp /tmp/scaffold/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          cp /tmp/scaffold/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          cp /tmp/scaffold/android/settings.gradle android/settings.gradle
          cp /tmp/scaffold/android/build.gradle android/build.gradle
          cp /tmp/scaffold/android/gradle.properties android/gradle.properties
          chmod +x android/gradlew

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeAssist-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TypeAssist build #${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
